name: ingest

on:
  schedule:
    # Every 15 minutes. GitHub often runs cron 10-30 min late under load; that is fine
    # here. Phase 0 measured OpenDota's own parse lag as the long pole, which is why this
    # is cron-only and there is no Cloudflare Worker (spec open item 5, resolved: A).
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [parse-replays]

# NEVER add `push`. This workflow commits, and a push trigger would retrigger it forever.

concurrency:
  group: parse
  cancel-in-progress: false
  # Not for rate limits — for correctness. Two overlapping runs compute the same diff,
  # fetch the same matches twice, and then collide on push.

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the ingest is stdlib-only by design.
      - name: Test derivation against golden fixtures
        run: npm test
        # If upstream silently changes a field, this fails BEFORE bad data is committed.
        # That matters: prior art found OpenDota returns 0 rather than erroring for a
        # field that does not exist, so a rotted mapping is otherwise invisible.

      - name: Ingest
        env:
          OPENDOTA_KEY: ${{ secrets.OPENDOTA_KEY }}
        run: node scripts/ingest.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'nothing changed — no commit'
            exit 0
          fi
          matches=$(node -e "console.log(require('./data/meta.json').matchCount)")
          rows=$(node -e "console.log(require('./data/meta.json').rowCount)")
          git commit -m "data: ${matches} matches, ${rows} rows"
          git push
